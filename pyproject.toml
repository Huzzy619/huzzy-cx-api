[project]
name = "huzzy-cx-api"
version = "0.1.0"
description = "Kora CX contact-centre API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that exercise real database constraints",
    "contract: adapter contract tests",
    "security: security-focused tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
