[project]
name = "kora-voice-worker"
version = "0.1.0"
description = "Kora CX realtime voice worker (LiveKit + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]~=1.5",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "langchain>=1.3.1",
    "langchain-core>=1.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "langmem>=0.0.30",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_worker"]
